services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: slc
      POSTGRES_PASSWORD: slc-dev
      POSTGRES_DB: slc
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - CORS_ORIGINS=["http://localhost:5174"]
      - DATABASE_URL=postgresql+asyncpg://slc:slc-dev@db:5432/slc
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000

volumes:
  pgdata:
